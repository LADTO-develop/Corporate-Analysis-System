entry_node: "data"

nodes:
  - name: "data"
    module: "cas.agents.nodes.data_node"
    fn: "run"
  - name: "feature_store"
    module: "cas.agents.nodes.feature_node"
    fn: "run"
  - name: "news_cache"
    module: "cas.agents.nodes.news_overlay_node"
    fn: "run"
  - name: "xgboost_inference"
    module: "cas.agents.nodes.base_prediction_node"
    fn: "run"
  - name: "rule_engine"
    module: "cas.agents.nodes.rule_engine_node"
    fn: "run"
  - name: "agno_agents"
    module: "cas.agents.nodes.committee_node"
    fn: "run"
  - name: "json_schema"
    module: "cas.agents.nodes.schema_node"
    fn: "run"
  - name: "report"
    module: "cas.agents.nodes.report_node"
    fn: "run"

edges:
  - [data, feature_store]
  - [feature_store, news_cache]
  - [news_cache, xgboost_inference]
  - [xgboost_inference, rule_engine]
  - [rule_engine, agno_agents]
  - [agno_agents, json_schema]
  - [json_schema, report]

conditional_edges:
  data:
    condition_fn: "cas.agents.nodes.data_node:has_enough_data"
    mapping:
      "enough": "feature_store"
      "insufficient": "json_schema"
